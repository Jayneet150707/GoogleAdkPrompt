# Paisalo Google AdK Chatbot - Docker Compose Configuration

version: '3.8'

services:
  paisalo-chatbot:
    build: .
    container_name: paisalo-adk-chatbot
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - LOG_LEVEL=INFO
      - SESSION_TIMEOUT_MINUTES=30
      - MAX_ACTIVE_SESSIONS=1000
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - paisalo-network

  # Optional: Redis for session storage (if needed for scaling)
  redis:
    image: redis:7-alpine
    container_name: paisalo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - paisalo-network
    profiles:
      - redis

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: paisalo-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - paisalo-chatbot
    restart: unless-stopped
    networks:
      - paisalo-network
    profiles:
      - nginx

volumes:
  redis_data:

networks:
  paisalo-network:
    driver: bridge

